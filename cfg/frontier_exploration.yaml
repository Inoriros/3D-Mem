# Frontier Exploration Configuration
# Based on eval_aeqa.yaml but simplified for frontier exploration

# General
seed: 77
exp_name: "frontier_exploration"
output_parent_dir: "exploration_results"
scene_dataset_config_path: "data/hm3d_annotated_basis.scene_dataset_config.json"
scene_data_path: "/home/yidu/extraSpace_projects/data/datasets/hm3d"

concept_graph_config_path: "cfg/concept_graph_default.yaml"

# camera, image
camera_height: 1.5
camera_tilt_deg: -30
img_width: 1280
img_height: 1280
hfov: 120

# whether to save visualization
save_visualization: true

# the image size for prompting (not used in frontier exploration but kept for compatibility)
prompt_h: 360
prompt_w: 360

# navigation
num_step: 60
init_clearance: 0.3
extra_view_phase_1: 2  # the number of extra views
extra_view_angle_deg_phase_1: 60  # the angle between each extra view
extra_view_phase_2: 6
extra_view_angle_deg_phase_2: 40

# about tsdf, depth map, and frontier updates
explored_depth: 1.7
tsdf_grid_size: 0.1
margin_w_ratio: 0.25
margin_h_ratio: 0.6
planner:
  eps: 1
  max_dist_from_cur_phase_1: 1  # when exploring frontiers, step with this length
  max_dist_from_cur_phase_2: 1  # when navigating to specific points, step with this length
  final_observe_distance: 0.75  # distance from target to observe it
  surrounding_explored_radius: 0.7

  # about frontier selection
  frontier_edge_area_min: 4
  frontier_edge_area_max: 6
  frontier_area_min: 8
  frontier_area_max: 9
  min_frontier_area: 20  # the frontier should have at least this many pixels
  max_frontier_angle_range_deg: 150  # the angle spanned by the pixels in a frontier should not be larger than this
  region_equal_threshold: 0.95
